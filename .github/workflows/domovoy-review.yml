name: Temporary Domovoy publication capability probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  publication-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted base helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Create update verify and remove clearly labelled probe
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYPROBE'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location('review_helper', 'tool/headless/github_review.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          repo, number = os.environ['PR_REPO'], int(os.environ['PR_NUMBER'])
          helper.metadata(repo, number)
          body = 'Domovoy publication capability probe. This is not an AI review; it will be removed immediately.'
          posted = helper.api(f'repos/{repo}/issues/{number}/comments', method='POST', payload={'body': body})
          comment_id = posted['id']
          try:
              assert posted['user']['login'] == 'github-actions[bot]'
              endpoint = f'repos/{repo}/issues/comments/{comment_id}'
              updated = helper.api(endpoint, method='PATCH', payload={'body': body + ' Update verified.'})
              actual = helper.api(endpoint)
              assert updated['id'] == comment_id == actual['id']
              assert actual['body'] == body + ' Update verified.'
              print(json.dumps({'probe': 'create-update-get', 'success': True, 'comment_id': comment_id, 'author': actual['user']['login']}))
          finally:
              helper.run(['gh', 'api', '--method', 'DELETE', f'repos/{repo}/issues/comments/{comment_id}'], github=True)
              print(json.dumps({'probe': 'cleanup', 'comment_id': comment_id, 'deleted': True}))
          PYPROBE
