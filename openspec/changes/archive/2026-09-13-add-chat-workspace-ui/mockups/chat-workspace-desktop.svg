<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Domovoy persistent chat workspace desktop preview</title>
  <desc id="desc">Dark desktop shell with a 276 pixel chat sidebar, centered conversation, user and assistant bubbles, collapsed reasoning, tool status, token summary, grouped model menu, reasoning selector, and rounded composer.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .primary { fill: #F2F4F8; }
      .secondary { fill: #9299A6; }
      .muted { fill: #707784; }
      .tiny { font-size: 12px; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .label { font-size: 14px; font-weight: 600; }
      .titleText { font-size: 17px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#101215"/>
  <rect width="276" height="960" fill="#17191D"/>
  <rect x="275" width="1" height="960" fill="#2A2E35"/>

  <!-- Sidebar -->
  <g class="ui">
    <circle cx="28" cy="29" r="10" fill="#AEBCEB"/>
    <text x="47" y="35" class="primary titleText">Domovoy</text>
    <rect x="16" y="58" width="244" height="42" rx="12" fill="#23262C" stroke="#343943"/>
    <path d="M34 73v12M28 79h12" stroke="#DDE4FA" stroke-width="1.8" stroke-linecap="round"/>
    <text x="52" y="85" class="primary label">New chat</text>

    <text x="20" y="130" class="muted tiny">RECENT</text>
    <rect x="10" y="142" width="256" height="58" rx="12" fill="#292D34"/>
    <rect x="10" y="142" width="3" height="58" rx="1.5" fill="#AEBCEB"/>
    <text x="24" y="167" class="primary small">Plan the release checklist</text>
    <text x="24" y="186" class="secondary tiny">GPT-5.4 · just now</text>

    <text x="24" y="225" class="primary small">Review persistence behavior</text>
    <text x="24" y="244" class="secondary tiny">DeepSeek V4 Pro · 24 min</text>
    <text x="24" y="283" class="primary small">Linux packaging notes</text>
    <text x="24" y="302" class="secondary tiny">Kimi K3 · yesterday</text>
    <text x="24" y="341" class="primary small">Token accounting edge cases</text>
    <text x="24" y="360" class="secondary tiny">GPT-5 mini · Sep 12</text>

    <line x1="16" y1="896" x2="260" y2="896" stroke="#2A2E35"/>
    <rect x="16" y="908" width="244" height="38" rx="10" fill="none"/>
    <circle cx="34" cy="927" r="8" fill="none" stroke="#9299A6" stroke-width="1.5"/>
    <path d="M34 915v4M34 935v4M22 927h4M42 927h4" stroke="#9299A6" stroke-width="1.2"/>
    <text x="52" y="932" class="secondary small">API key settings</text>
  </g>

  <!-- Header -->
  <g class="ui">
    <rect x="276" width="1164" height="54" fill="#121418"/>
    <line x1="276" y1="53.5" x2="1440" y2="53.5" stroke="#242830"/>
    <text x="314" y="33" class="primary label">Plan the release checklist</text>
    <rect x="1116" y="12" width="236" height="30" rx="15" fill="#1D2025" stroke="#2E333C"/>
    <text x="1132" y="31" class="secondary tiny">Context 18.6k / 1.05m</text>
    <circle cx="1260" cy="27" r="2" fill="#687080"/>
    <text x="1270" y="31" class="secondary tiny">History 31.2k</text>
    <circle cx="1396" cy="27" r="14" fill="#1D2025"/>
    <circle cx="1390" cy="27" r="1.7" fill="#A4ABB8"/>
    <circle cx="1396" cy="27" r="1.7" fill="#A4ABB8"/>
    <circle cx="1402" cy="27" r="1.7" fill="#A4ABB8"/>
  </g>

  <!-- Timeline -->
  <g class="ui">
    <text x="528" y="102" class="muted tiny">TODAY</text>

    <rect x="724" y="126" width="438" height="74" rx="18" fill="#29303B" stroke="#384355"/>
    <text x="748" y="157" class="primary body">Create a concise release checklist for Linux</text>
    <text x="748" y="180" class="primary body">and web, including verification evidence.</text>

    <rect x="510" y="226" width="652" height="56" rx="14" fill="#191C21" stroke="#2A2F38"/>
    <circle cx="535" cy="254" r="10" fill="#252A32"/>
    <path d="M531 252l4 4 6-7" fill="none" stroke="#9EADE0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="555" y="251" class="secondary small">Reasoning</text>
    <text x="555" y="268" class="muted tiny">Collapsed · 1,284 reasoning tokens</text>
    <path d="M1138 250l6 6 6-6" fill="none" stroke="#818997" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="510" y="302" width="652" height="106" rx="16" fill="#1B1E23" stroke="#303640"/>
    <circle cx="536" cy="330" r="9" fill="#22332C"/>
    <path d="M532 330l3 3 5-6" fill="none" stroke="#79C69B" stroke-width="1.5"/>
    <text x="554" y="334" class="primary label">workspace.inspect</text>
    <rect x="532" y="350" width="606" height="40" rx="8" fill="#14161A"/>
    <text x="546" y="375" class="secondary tiny mono">{"targets":["linux","web"],"mode":"read-only"}</text>
    <text x="1073" y="334" fill="#79C69B" class="tiny">Completed</text>

    <rect x="510" y="430" width="652" height="190" rx="18" fill="#1D2025" stroke="#2B3038"/>
    <text x="536" y="463" class="primary body">Release checklist</text>
    <circle cx="539" cy="491" r="3" fill="#AEBCEB"/>
    <text x="554" y="496" class="primary body">Run formatting, analysis, and the full test suite.</text>
    <circle cx="539" cy="526" r="3" fill="#AEBCEB"/>
    <text x="554" y="531" class="primary body">Build Linux and web from the same verified tree.</text>
    <circle cx="539" cy="561" r="3" fill="#AEBCEB"/>
    <text x="554" y="566" class="primary body">Record commands, exit codes, output, and revision.</text>
    <circle cx="539" cy="596" r="3" fill="#AEBCEB"/>
    <text x="554" y="601" class="primary body">Review the complete requirement matrix before release.</text>
  </g>

  <!-- Grouped model menu preview -->
  <g class="ui" filter="url(#shadow)">
    <rect x="778" y="542" width="286" height="244" rx="16" fill="#202329" stroke="#373D47"/>
    <text x="798" y="570" class="muted tiny">OPENAI</text>
    <rect x="790" y="580" width="262" height="38" rx="9" fill="#2B3038"/>
    <circle cx="809" cy="599" r="7" fill="none" stroke="#B6C4F4" stroke-width="1.5"/>
    <circle cx="809" cy="599" r="3.5" fill="#B6C4F4"/>
    <text x="826" y="604" class="primary small">GPT-5.4</text>
    <text x="798" y="641" class="secondary small">GPT-5 mini</text>
    <text x="798" y="673" class="secondary small">GPT-4o mini</text>
    <text x="798" y="704" class="muted tiny">DEEPSEEK</text>
    <text x="798" y="732" class="secondary small">DeepSeek V4 Flash</text>
    <text x="798" y="760" class="secondary small">DeepSeek V4 Pro</text>
    <text x="943" y="704" class="muted tiny">MOONSHOT AI</text>
  </g>

  <!-- Composer -->
  <g class="ui" filter="url(#shadow)">
    <rect x="478" y="760" width="718" height="154" rx="25" fill="#202329" stroke="#373D47"/>
    <text x="506" y="798" class="secondary body">Ask Domovoy anything…</text>
    <line x1="502" y1="836" x2="1172" y2="836" stroke="#2E333C"/>

    <rect x="502" y="852" width="136" height="38" rx="19" fill="#292D34" stroke="#3A414C"/>
    <circle cx="521" cy="871" r="7" fill="#AEBCEB"/>
    <text x="536" y="876" class="primary small">GPT-5.4</text>
    <path d="M616 868l4 4 4-4" fill="none" stroke="#9299A6" stroke-width="1.2"/>

    <rect x="648" y="852" width="136" height="38" rx="19" fill="#292D34" stroke="#3A414C"/>
    <text x="666" y="876" class="primary small">Reasoning: high</text>

    <text x="807" y="875" class="muted tiny">Request 2.1k · Response 1.7k</text>
    <circle cx="1152" cy="871" r="22" fill="#DCE4FF"/>
    <path d="M1152 880V862M1145 869l7-7 7 7" fill="none" stroke="#222733" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1294" y="940" class="ui muted tiny">Planning preview · no approval gate</text>
</svg>
